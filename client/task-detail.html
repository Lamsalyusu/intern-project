<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Task Detail</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <h2><a href="dashboard.html" style="text-decoration:none;color:inherit;">← Back</a></h2>
    <!-- <button onclick="logout()">Logout</button>
     <button  -->
     <button id="btnLogout">Logout</button>
  </nav>

  <div class="container">
    <div id="taskInfo"></div>

    <h3 style="margin-top:24px;">Collaborators</h3>
    <div id="collaborators"></div>
    <form id="addCollabForm" style="display:flex;gap:8px;margin-top:8px;">
      <input type="email" id="collabEmail" placeholder="Add by email" required style="flex:1;" />
      <button type="submit">Add</button>
    </form>

    <h3 style="margin-top:24px;">Chat</h3>
    <div class="chat-box">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <!-- <button onclick="sendChat()">Send</button>
          -->
        <button id = "btnSendChat">Send</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/task-details.js"></script>
  <script src="js/chat.js"></script>
  <script>redirectIfNotAuth(); initTaskDetail();</script>
</body>
</html>
